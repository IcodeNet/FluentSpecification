name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version and .NET runtime
      placeholder: "FluentSpecification 1.0.0, .NET 10, Linux"
    validations:
      required: true
