name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release /warnaserror
      - run: dotnet test -c Release --no-build
      - name: Pack (runs package validation against 1.0.0)
        run: dotnet pack FluentSpecification -c Release --no-build -o out
      - run: dotnet run -c Release --no-build --project FluentSpecification.Samples
