<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Candidates flow through a specification and become satisfying elements">
  <style>
    text{font-family:Segoe UI,Helvetica,Arial,sans-serif;text-anchor:middle}
    .b{font-size:18px;font-weight:700;fill:#ffffff}
    .m{font-size:14px;fill:#6b7280}
    .k{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#1e3a8a}
  </style>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="860" height="200" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="30" y="60" width="200" height="70" rx="12" fill="#6b7280"/>
  <text x="130" y="92" class="b">Candidates</text><text x="130" y="116" style="fill:#e5e7eb;font-size:14px">IQueryable&lt;T&gt;</text>
  <line x1="236" y1="95" x2="324" y2="95" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="330" y="50" width="200" height="90" rx="12" fill="#6d28d9"/>
  <text x="430" y="86" class="b">Specification</text><text x="430" y="112" style="fill:#ede9fe;font-size:14px">And · Or · Not</text>
  <line x1="536" y1="95" x2="624" y2="95" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="630" y="60" width="200" height="70" rx="12" fill="#059669"/>
  <text x="730" y="92" class="b">Matches</text><text x="730" y="116" style="fill:#d1fae5;font-size:14px">IQueryable&lt;T&gt;</text>
  <text x="430" y="170" class="k">spec.SatisfyingElementsFrom(candidates)</text>
</svg>
