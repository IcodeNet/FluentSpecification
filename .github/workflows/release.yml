name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tag must match the project version
        run: |
          project_version="$(dotnet msbuild FluentSpecification -getProperty:Version)"
          if [ "${GITHUB_REF_NAME#v}" != "$project_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match <Version> $project_version in the csproj" >&2
            exit 1
          fi
      - run: dotnet build -c Release /warnaserror
      - run: dotnet test -c Release --no-build
      - run: dotnet pack FluentSpecification -c Release --no-build -o out
      - name: NuGet login (GitHub OIDC to a short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" out/*.nupkg out/*.snupkg --generate-notes --title "${{ github.ref_name }}"
